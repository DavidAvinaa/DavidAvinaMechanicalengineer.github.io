<html lang="en">

<script type="importmap">

}

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#f5f7fb,#dfe6f2);
color:#2c3e50;
}

.container{
max-width:1000px;
margin:auto;
padding:60px 20px;
}

h1,h2{
color:#1e3799;
}

.project-button{
width:100%;
padding:18px;
margin-top:15px;
font-size:17px;
background:#1e3799;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
text-align:left;
transition:0.3s;
}

.project-button:hover{
background:#162f80;
transform:translateY(-2px);
}

.sub-button{
width:100%;
padding:14px;
margin-top:10px;
font-size:15px;
background:#2f6df6;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
text-align:left;
}

.sub-button:hover{
background:#1d4ed8;
}

.project-content{
display:none;
background:white;
padding:25px;
margin-top:10px;
border-radius:6px;
box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.sub-content{
display:none;
margin-top:15px;
padding:15px;
background:#f7f9fc;
border-radius:8px;
}

.viewer{
width:100%;
height:520px;
background:linear-gradient(180deg,#f7f9fc,#e3e8f0);

}

.back{
text-decoration:none;
color:white;
background:#1e3799;
padding:10px 16px;
border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back">⬅ Back</a>

<h1>David Aviña</h1>
<h2>Mechanical Engineer</h2>

<p>
Mechanical and Energy Systems Engineer with professional experience in structural steel fabrication and engineering coordination.
</p>

<h2>Project Management Experience</h2>

<button class="project-button" onclick="toggleProject('p1')">
IMSS Clinic 25 Structural Steel Project
</button>

<div class="project-content" id="p1">

<button class="sub-button" onclick="toggleSub('columna')">3. Columna</button>

<div class="sub-content" id="columna">
<div class="viewer" id="viewerIMSS"></div>
</div>

<button class="sub-button" onclick="toggleSub('campo')">4. Columna en Campo</button>

<div class="sub-content" id="campo">
<div class="viewer" id="viewerCampo"></div>
</div>

</div>



<button class="project-button" onclick="toggleProject('p2')">
CORE-LOC Special Formwork System
</button>

<div class="project-content" id="p2">

<div class="viewer" id="viewerCORE"></div>

</div>

</div>



<script type="module">

import * as THREE from "three";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js";
import {STLLoader} from "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/STLLoader.js";



window.toggleProject=function(id){

const section=document.getElementById(id);

section.style.display =
section.style.display==="block" ? "none" : "block";

if(id==="p2" && !window.coreLoaded){

loadSTL("viewerCORE","./models/CORE-LOC.stl");
window.coreLoaded=true;

}

}



window.toggleSub=function(id){

const section=document.getElementById(id);

section.style.display =
section.style.display==="block" ? "none" : "block";

if(id==="columna" && !window.columnaLoaded){

loadSTL("viewerIMSS","./models/COLUMNAIMSS.stl");
window.columnaLoaded=true;

}

if(id==="campo" && !window.campoLoaded){

loadSTL("viewerCampo","./models/ESTRUCTURAIMSS.stl");
window.campoLoaded=true;

}

}



function loadSTL(viewer,model){

const container=document.getElementById(viewer);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf4f7fb);



const camera=new THREE.PerspectiveCamera(
45,
container.clientWidth/container.clientHeight,
0.1,
10000
);



const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth,container.clientHeight);

container.appendChild(renderer.domElement);



const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;



/* ILUMINACIÓN MEJORADA */

const hemi=new THREE.HemisphereLight(0xffffff,0x444444,1.2);
scene.add(hemi);

const light1=new THREE.DirectionalLight(0xffffff,1.4);
light1.position.set(500,600,500);
scene.add(light1);

const light2=new THREE.DirectionalLight(0xffffff,1.1);
light2.position.set(-400,300,200);
scene.add(light2);

const light3=new THREE.DirectionalLight(0xffffff,1);
light3.position.set(200,500,-400);
scene.add(light3);

const light4=new THREE.DirectionalLight(0xffffff,0.8);
light4.position.set(-200,-200,300);
scene.add(light4);



const loader=new STLLoader();

loader.load(model,function(geometry){

geometry.center();



const material=new THREE.MeshStandardMaterial({

color:0x2f6df6,
metalness:0.9,
roughness:0.3

});



const mesh=new THREE.Mesh(geometry,material);



/* MISMA POSICIÓN QUE COLUMNA EN CAMPO */

mesh.rotation.x = -Math.PI/2;



scene.add(mesh);



/* AUTOESCALA */

const box=new THREE.Box3().setFromObject(mesh);
const size=box.getSize(new THREE.Vector3()).length();

const scale=220/size;
mesh.scale.set(scale,scale,scale);



camera.position.set(300,200,300);



controls.target.set(0,0,0);



function animate(){

requestAnimationFrame(animate);



/* MISMA ROTACIÓN */

mesh.rotation.z += 0.002;



controls.update();
renderer.render(scene,camera);

}

animate();

});

}

</script>

</body>
</html>
